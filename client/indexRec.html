<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/styleRec.css">
    <title>Añadir Recetas</title>
</head>
<body id="pag-receta">

    <div>
        <header id="titulo">
            <h1>Crear Nueva Receta</h1>
        </header>
    </div>
    <main>
        
        <article id="form-base">
            <form action="POST" id="form-receta-cabezera"  class="forms-recetas">
                
                <!-- GRID CABECERA: FOTO A LA IZQUIERDA, NOMBRE Y PRECIO A LA DERECHA -->
                <div class="grid-cabecera">
                    
                    <div class="contenedor-upload-img">
                        <label for="input-foto-receta" id="dropzone-foto">
                            <!-- Vista previa oculta con la clase .oculto por defecto -->
                            <img id="preview-foto" src="" alt="Vista previa" class="oculto">
                            
                            <div id="placeholder-foto">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                                <span>Subir Foto</span>
                            </div>
                        </label>
                        <!-- ESTE ES EL INPUT QUE SE OCULTARÁ CON EL CSS -->
                        <input type="file" id="input-foto-receta" name="imagenRF" accept="image/*" >
                    </div>

                    <div class="columna-campos">
                        <div class="grupo-input">
                            <label for="nombre">Nombre de la Receta</label>
                            <input type="text" name="nombre" id="nombre-input" required>
                        </div>

                        <div class="grupo-input">
                            <label for="precio-venta">Precio de Venta</label>
                            <input type="number" name="precio" id="precio-input" min="1" required>
                        </div>
                    </div>

                </div> <!-- Fin grid-cabecera -->

                <!-- GRID DE 2 COLUMNAS: CATEGORÍA Y YOUTUBE -->
                <div class="grid-2-col">
                    <div class="grupo-input">
                        <label for="categoria">Categoría</label>
                        <select name="categoria" id="tipo-receta" required>
                            <option value="" selected disabled>Selecciona una opción</option>
                            <option value="Mixologia">Mixología</option>
                            <option value="Clasicos">Clásicos</option>
                            <option value="Shots">Shots</option>
                            <option value="Cafe">Café</option>
                        </select>
                    </div>

                    <div class="grupo-input">
                        <label for="youtube">Link de YouTube (Opcional)</label>
                        <input type="url" name="link_Youtube" id="youtube-input" placeholder="https://youtube.com/watch?v=...">
                    </div>
                </div>

                <button type="submit" id="btn-principal" disabled>Guardar Receta</button>
            </form>
        </article>

        <article>
            <div class="container" id="barra-busqueda">
                <div class="campo-busqueda-wrapper">
                    <input type="text" name="barra" id="id-barra-busqueda" placeholder="Buscar Ingrediente..." autocomplete="off">
                    <div class="autocompletado oculto" id="menu-Busqueda">
                    </div>
                </div>
            </div>

            <div class="container" id="tabla-ingredientes">
                <table class="tabla-dinamica" id="tabla">
                    <thead>
                        <tr>
                        <th></th>
                        <th>Ingrediente</th>
                        <th>Cantidad</th>
                        <th>Medida</th>
                        </tr>
                    </thead>
                    <tbody id="ing-dinamicos">
                    </tbody>
                </table>
            </div>
        </article>
    </main>
    <script src="src/pages/recetaNueva.ts" type="module"></script>
</body>
</html>
